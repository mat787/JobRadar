<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobRadar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="JobRadar, strona główna"><span class="logo-mark" aria-hidden="true"></span></a>
    <a class="toplink" href="#/oferty" data-route="offers">Oferty</a>
    <form class="topsearch" id="topsearch" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="topsearch-input" type="search" placeholder="Wyszukaj" aria-label="Wyszukaj oferty">
    </form>
    <a class="toplink" href="#/jobbro" data-route="jobbro" title="Agent AI">JobBro</a>
    <a class="topicon" href="#/aplikacje" data-route="apps" aria-label="Moje aplikacje i poczta" title="Moje aplikacje">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </a>
    <a class="topicon" href="#/profil" data-route="profile" aria-label="Mój profil" title="Mój profil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4-6.5 8-6.5s7 2 8 6.5"/></svg>
    </a>
  </header>
  <main class="main" id="app" aria-live="polite"></main>
  <footer class="appfoot"><button class="theme-toggle" type="button" id="theme-toggle">Tryb jasny</button></footer>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
